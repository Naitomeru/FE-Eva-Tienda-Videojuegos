<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOMBRE TIENDA</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <script src="script.js"></script>
</head>
<body>
    <header>
        <div class="header-main">
            <a id="header-logo" href="index.html">
                <img src="images/logo.png">
            </a>
    
            <div id="header-searcher">
                <input type="text" placeholder="Buscar...">
                <button type="submit">
                    <i class="fa fa-search"></i>
                </button>
            </div>
        </div>

        <div class="header-buttons-container">
            <div id="ofertas-button" class="header-button">
                Ofertas
            </div>
            <div id="preventas-button" class="header-button">
                Preventas
            </div>
            <div id="nintendo-button" class="header-button">
                Nintendo
                <div class="header-button-popup">
                    <a href="galeria.html?tipo=Consolas&categoria=Nintendo">Consolas</a>
                    <a href="galeria.html?tipo=Videojuegos&categoria=Nintendo">Videojuegos</a>
                </div>
            </div>
            <div id="playstation-button" class="header-button">
                PlayStation
                <div class="header-button-popup">
                    <a href="galeria.html?tipo=Consolas&categoria=PlayStation">Consolas</a>
                    <a href="galeria.html?tipo=Videojuegos&categoria=PlayStation">Videojuegos</a>
                </div>
            </div>
            <div id="xbox-button" class="header-button">
                Xbox
                <div class="header-button-popup">
                    <a href="galeria.html?tipo=Consolas&categoria=Xbox">Consolas</a>
                    <a href="galeria.html?tipo=Videojuegos&categoria=Xbox">Videojuegos</a>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="body-space"></div>

        <div id="login-form">
            <form name="f-login">
                <div>
                    <label for="f-email">Correo electrónico</label>
                    <input type="text" name="f-email" id="f-email">
                </div>
                
                <div>
                    <label for="f-password">Contraseña</label>
                    <input type="text" name="f-password" id="f-password">
                </div>

                <div class="center-button">
                    <button id="login-button">
                        Iniciar sesión
                    </button>
                </div>
            </form>
            <div>
                ¿No tienes una cuenta? <a href="register.html">Regístrate</a>
            </div>
        </div>

        <div class="body-space"></div>
    </main>

    <!-- Carrusel de marcas -->
    <section class="brands-carousel">
        <div class="brands-track">
            <div class="brand-item">
                <img src="images/logos/nintendo.png" alt="Nintendo">
            </div>

            <div class="brand-item">
                <img src="images/logos/playstation.png" alt="PlayStation">
            </div>

            <div class="brand-item">
                <img src="images/logos/xbox.png" alt="Xbox">
            </div>

            <div class="brand-item">
                <img src="images/logos/nintendo.png" alt="Nintendo">
            </div>

            <div class="brand-item">
                <img src="images/logos/playstation.png" alt="PlayStation">
            </div>

            <div class="brand-item">
                <img src="images/logos/xbox.png" alt="Xbox">
            </div>

            <div class="brand-item">
                <img src="images/logos/nintendo.png" alt="Nintendo">
            </div>

            <div class="brand-item">
                <img src="images/logos/playstation.png" alt="PlayStation">
            </div>

            <div class="brand-item">
                <img src="images/logos/xbox.png" alt="Xbox">
            </div>

            <div class="brand-item">
                <img src="images/logos/nintendo.png" alt="Nintendo">
            </div>

            <div class="brand-item">
                <img src="images/logos/playstation.png" alt="PlayStation">
            </div>

            <div class="brand-item">
                <img src="images/logos/xbox.png" alt="Xbox">
            </div>
        </div>
    </section>
    
    <footer>
        <div class="footer-flex">
            <div class="footer-socials">
                <a id="footer-logo" href="index.html">
                    <img src="images/logo.png">
                </a>
                <nav>
                    <a>
                        <i class="fa fa-brands fa-facebook-square fa-2x"></i>
                    </a>
                    <a>
                        <i class="fa fa-brands fa-instagram fa-2x"></i>
                    </a>
                    <a>
                        <i class="fa fa-brands fa-tiktok fa-2x"></i>
                    </a>
                </nav>
            </div>
            
            <section class="footer-section">
                <h1>Categorías</h1>
                <a href="galeria.html?tipo=consolas">Consolas</a>
                <a href="galeria.html?tipo=videojuegos">Videojuegos</a>
                <a href="galeria.html?tipo=ofertas">Ofertas</a>
                <a href="galeria.html?tipo=preventas">Preventa</a>

            </section>
        </div>
